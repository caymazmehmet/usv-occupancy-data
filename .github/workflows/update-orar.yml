name: Update USV Orar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"
      timezone: "Europe/Bucharest"

permissions:
  contents: write

concurrency:
  group: update-usv-orar-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Update Orar and academic calendar data
        run: |
          python tools/fetch_usv_all_campus_orar.py --group-stop-after-empty 50

      - name: Commit and push JSON updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Önce yeni verileri paketle (add)
          git add data/ backup/ || true
          
          # Değişiklik varsa kaydet (commit) ve yükle (push)
          if git diff --cached --quiet; then
            echo "No JSON changes to commit."
          else
            git commit -m "Update USV occupancy data [skip ci]"
            git pull origin main --rebase
            git push origin main
          fi
